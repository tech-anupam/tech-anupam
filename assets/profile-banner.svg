  <text x="72" y="228" font-size="16" font-weight="700" fill="#8b8b93" letter-spacing="1.5">FULL-STACK DEVELOPER, INDIE BUILDER.</text>

  <line x1="70" y1="252" x2="1130" y2="252" stroke="#1c1c22" stroke-width="1"/>

