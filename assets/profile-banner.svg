<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',Arial,sans-serif">
  <defs>
    <radialGradient id="glow" cx="82%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#3a3a42" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0c0c0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1c22" stop-opacity="0"/>
      <stop offset="50%" stop-color="#26262e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1c1c22" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="20" fill="#0c0c0e"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow)"/>

  <g opacity="0.45">
    <path d="M -50 330 Q 250 292 600 322 T 1250 300" fill="none" stroke="url(#wave1)" stroke-width="1.5">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M -50 330 Q 250 292 600 322 T 1250 300;
                M -50 322 Q 250 308 600 300 T 1250 326;
                M -50 330 Q 250 292 600 322 T 1250 300"/>
    </path>
    <path d="M -50 350 Q 300 330 650 348 T 1250 338" fill="none" stroke="#1f1f26" stroke-width="1.2" opacity="0.7">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="M -50 350 Q 300 330 650 348 T 1250 338;
                M -50 342 Q 300 352 650 332 T 1250 350;
                M -50 350 Q 300 330 650 348 T 1250 338"/>
    </path>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="377" rx="19" fill="none" stroke="#1c1c22" stroke-width="1"/>

  <!-- icon mark -->
