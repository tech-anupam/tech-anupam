    <text x="460" y="329" font-size="14" font-weight="600" fill="#e6e6ea">Instagram</text>
    <text x="460" y="346" font-size="12" fill="#6c6c74" font-family="'Segoe UI',Arial,sans-serif" stroke="none">tech.anupam</text>

